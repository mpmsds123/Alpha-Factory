[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research-orchestrator"
version = "0.5.0"
description = "A hypothesis-driven, budget-gated alpha research factory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "openai>=2.0",
  "pydantic>=2.12",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "black>=24.0",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
alpha-factory = "alpha_orchestrator.factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alpha_orchestrator = ["default_prompts/*.md", "default_prompts/guides/*.md"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=alpha_orchestrator --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["."]  # tests import shared fakes as tests.factory.*

[tool.coverage.run]
source = ["alpha_orchestrator"]
omit = ["src/alpha_orchestrator/factory/cli.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  '\.\.\.',
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The factory's user-facing output (CLI help, dashboard, reports) is in Chinese for its
# operator; RUF001-003 would flag every fullwidth CJK punctuation mark as "ambiguous".
"src/alpha_orchestrator/factory/*.py" = ["RUF001", "RUF002", "RUF003"]
# HTML template strings; wrapping them hurts readability more than long lines do.
"src/alpha_orchestrator/factory/dashboard.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"src/alpha_orchestrator/factory/story.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"tests/factory/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["alpha_orchestrator"]
