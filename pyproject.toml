[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-research-orchestrator"
version = "0.3.0"
description = "An offline-first, evidence-gated alpha research orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "alembic>=1.13",
  "httpx>=0.27",
  "openai>=2.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
alpha-lab = "alpha_orchestrator.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alpha_orchestrator = ["default_policies/*.yaml", "default_prompts/*.md"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=alpha_orchestrator --cov-branch --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
source = ["alpha_orchestrator"]
omit = ["src/alpha_orchestrator/cli/*"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  '\.\.\.',
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["alpha_orchestrator"]
