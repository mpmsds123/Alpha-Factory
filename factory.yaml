# Factory configuration. Every default and the reason for it is in
# src/alpha_orchestrator/factory/config.py; values here override them.
# Submission gates are not configurable: they come from the official docs.
db_path: ~/.alpha_factory/factory_v8.db   # the factory's one database, outside the repo
reports_dir: reports                      # progress CSVs (git-ignored)
private_dir: ~/.alpha_factory/private     # platform vocabulary, never committed
scanner_runs: ""                          # template scanner runs folder (originality check)
v7_db: ~/.alpha_factory/factory.db        # read once by `alpha-factory memory import-v7`

policy:
  regions: []      # empty = every region the account offers
  delay: 1
  submit_mode: approve   # or "auto": submit up to 4 a day without asking

budget:
  daily_sim_cap: 1000
  quota_timezone: America/Los_Angeles
  quota_reset_hour: 21

cost:
  daily_usd_cap: 5.0
  usd_per_pass_max: 1.6
