# Alpha 工厂配置。每个数字的出处见 src/alpha_orchestrator/factory/config.py。
db_path: ~/.alpha_factory/factory.db     # 账本，放在仓库外
reports_dir: reports                     # 面板（含真实表达式，已 gitignore）
scanner_progress: ~/Desktop/因子挖掘/scanner/runs/数据集进度.csv   # 旧，已不用
scanner_runs: ~/Desktop/因子挖掘/scanner/runs   # v7：只用来给字段做标记，不再用来挑数据集或筛字段
only_datasets: []                       # 空 = v7 从全部数据集里随机抽
design: v7                              # v7（11/03）：随机选数据集、点子记忆、菜单改法 + Thompson sampling、同时 6 个点子

budget:
  v1_daily_cap: 1000         # Factory allocation: at most 1,000 launched children / allocation day
  daily_sim_cap: 1000        # Same hard cap for the legacy entrypoint
  quota_timezone: America/Los_Angeles
  quota_reset_hour: 21      # Existing scanner allocation resets at 21:00 Pacific
  quota_reserve: 0          # This factory has its own 1,000-simulation allocation
  active_datasets: 1         # 你定的：一次只做一个数据集
  dataset_sim_cap: 1000      # Per-dataset lifetime allowance; daily hard cap still applies
  health_sample: 40          # 体检抽多少个家族
  survey_per_stratum: 2      # 普查每层抽几个家族（家族总数 ≤40 时全部普查）
  survey_max_families: 100
  round_size: 50             # 找到信号后，每一轮分配多少次回测
  refine_structures: 3       # 挖深时每轮试几种结构
  combo_count: 6             # 挖组合时 DeepSeek 和随机各几条
  slots: 6                   # 上限；平台拒绝时自动降到平台接受的数，并记住
  children_per_slot: 10
  min_batch_interval_s: 20   # 防 429 风暴

thresholds:
  noise_sigma: 0.316         # 第 5 问：扫描器无信号数据集实测 0.25-0.33
  screen_line: 0.8           # 普查的排队线（不是过关线）
  min_filled_coverage: 0.50  # 默认值，待你确认：按更新周期补齐后的覆盖率门槛
  suspicious_sharpe: 3.0     # 你定的：超过就判可疑，不挖
  suspicious_turnover: 0.70
  refine_min_gain: 0.35      # 第 5 问：比 0.35 小的提升多半是噪音
  submit_sharpe: 1.58
  submit_sharpe_chn: 2.08
  submit_fitness: 1.0
  robust_keep_ratio: 0.5
  pnl_corr_max: 0.7
  dataset_cap: 8             # 每个数据集最多交 8 个
  margin_bps: {USA: 5.0, CHN: 20.0, IND: 20.0, MEA: 20.0, default: 15.0}

llm:
  base_url: https://api.deepseek.com
  model: deepseek-flash                  # 字段分组、写提交说明
  strong_model: deepseek-v4-pro          # 挖组合
  key_file: ~/secrets/deepseek.json      # {"api_key": "..."}，只在调用时读取

policy:
  max_submissions_per_day: 4
  auto_submit: false                     # 提交永远由你确认
  regions: [USA, GLB, EUR, ASI, AMR, JPN, GBR, DEU, ALL]   # v7：不抽 CHN、IND（你的经验：这两个地区不出货）
  delays: [1]
